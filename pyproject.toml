[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termgraph"
version = "1.0.0"
description = "A simple graphing calculator for the terminal."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "simpleeval>=1.0.7",
]

[project.scripts]
termgraph = "termgraph.main:main"